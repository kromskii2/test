version: 2
updates:
  # Обновление npm-зависимостей
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    reviewers:
      - "your-github-username"  # Замени на свой username или команду
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "node-telegram-bot-api"
        update-types: ["version-update:semver-major"]

  # Обновление GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    reviewers:
      - "devops-team"  # Замени на свою команду или пользователя

  # Обновление Docker образов (анонимно, без логина)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "docker"
    reviewers:
      - "devops-team"
